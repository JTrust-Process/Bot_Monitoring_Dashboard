name: Bot Health Monitor

on:
  schedule:
    - cron: "13,43 * * * *"   # offset from :00/:30 to avoid GHA peak load
  workflow_dispatch: {}

# Prevent overlapping runs
concurrency:
  group: bot-health
  cancel-in-progress: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: monitor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore status state
        uses: actions/cache/restore@v4
        with:
          path: monitor/status_state.json
          key: bot-health-state-${{ github.run_id }}
          restore-keys: |
            bot-health-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: monitor/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run health check
        env:
          CRYPTO_SUPABASE_URL:      ${{ secrets.CRYPTO_SUPABASE_URL }}
          CRYPTO_SUPABASE_ANON_KEY: ${{ secrets.CRYPTO_SUPABASE_ANON_KEY }}
          STOCK_SUPABASE_URL:       ${{ secrets.STOCK_SUPABASE_URL }}
          STOCK_SUPABASE_ANON_KEY:  ${{ secrets.STOCK_SUPABASE_ANON_KEY }}
          HEALTH_WEBHOOK_URL:       ${{ secrets.HEALTH_WEBHOOK_URL }}
          GH_PAT_BOT_RESTART:       ${{ secrets.GH_PAT_BOT_RESTART }}
        run: python health_check.py

      - name: Save status state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: monitor/status_state.json
          key: bot-health-state-${{ github.run_id }}