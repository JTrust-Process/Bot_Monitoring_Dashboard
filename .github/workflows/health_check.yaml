name: Bot Health Monitor

on:
  schedule:
    - cron: "8,23,38,53 * * * *"   # every 15 min, offset from peak load (GHA cron drift can be 15–60 min)
  workflow_dispatch: {}

# Prevent overlapping runs
concurrency:
  group: bot-health
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: monitor   # all `run:` steps execute from monitor/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore status state
        uses: actions/cache/restore@v4
        with:
          path: monitor/status_state.json
          key: bot-health-state-v1
          restore-keys: |
            bot-health-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: monitor/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run health check
        env:
          CRYPTO_SUPABASE_URL:      ${{ secrets.CRYPTO_SUPABASE_URL }}
          CRYPTO_SUPABASE_ANON_KEY: ${{ secrets.CRYPTO_SUPABASE_ANON_KEY }}
          STOCK_SUPABASE_URL:       ${{ secrets.STOCK_SUPABASE_URL }}
          STOCK_SUPABASE_ANON_KEY:  ${{ secrets.STOCK_SUPABASE_ANON_KEY }}
          # Trading Bot League control plane. Without these the five League
          # bots (etf_rotation_v1, short_watchlist_v1, bond_research_v1,
          # agent_research_v1, ...) have NO alerting — etf_rotation_v1 is
          # mode='live', so that gap covers real capital. Anon key only;
          # this monitor never writes to the League.
          LEAGUE_SUPABASE_URL:      ${{ secrets.LEAGUE_SUPABASE_URL }}
          LEAGUE_SUPABASE_ANON_KEY: ${{ secrets.LEAGUE_SUPABASE_ANON_KEY }}
          HEALTH_WEBHOOK_URL:       ${{ secrets.HEALTH_WEBHOOK_URL }}
          # Dead-man's switch. Optional — set this repo secret to a check URL
          # from healthchecks.io / Better Stack / Cronitor and configure the
          # expected period to match the cron above. Without it, a monitor
          # that stops running is indistinguishable from all-clear, because
          # every failure mode here presents as silence.
          HEALTH_DEADMAN_URL:       ${{ secrets.HEALTH_DEADMAN_URL }}
          # Only needed if a bot sets restart_enabled=True. Both are
          # currently False, so this is unused credential surface — consider
          # removing the secret until auto-restart is actually opted into.
          GH_PAT_BOT_RESTART:       ${{ secrets.GH_PAT_BOT_RESTART }}
        run: python health_check.py

      - name: Save status state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: monitor/status_state.json
          key: bot-health-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
